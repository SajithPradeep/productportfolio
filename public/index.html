<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/man.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Updated by useTheme so mobile browser chrome matches the page. -->
    <meta name="theme-color" content="#fbfaf8" />

    <title>Sajith Pradeep — Product Manager</title>
    <meta
      name="description"
      content="Product Manager on Deloitte's AI innovation team, building agentic AI systems and Salesforce Agentforce products. 10+ years across frontend engineering, business analysis and product management."
    />
    <link rel="canonical" href="https://sajithpradeep.in/" />

    <!-- Link preview cards. Without these, sharing the URL in outreach or on
         LinkedIn renders a bare link with no title, image, or summary. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sajith Pradeep" />
    <meta property="og:title" content="Sajith Pradeep — Product Manager" />
    <meta
      property="og:description"
      content="Building agentic AI systems on Deloitte's AI innovation team. A decade across engineering, business analysis and product."
    />
    <meta property="og:url" content="https://sajithpradeep.in/" />
    <meta property="og:image" content="https://sajithpradeep.in/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sajith Pradeep — Product Manager" />
    <meta
      name="twitter:description"
      content="Building agentic AI systems on Deloitte's AI innovation team. A decade across engineering, business analysis and product."
    />
    <meta name="twitter:image" content="https://sajithpradeep.in/og-card.png" />

    <!-- Fonts. Preconnect first so the stylesheet request doesn't pay for DNS
         and TLS. `display=swap` renders fallback text rather than blank. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>You need to enable JavaScript to view this site.</noscript>
    <div id="root"></div>
  </body>
</html>
